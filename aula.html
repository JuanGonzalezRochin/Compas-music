<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aula · Compás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="app.css?v=9">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .aula { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 440px; min-height: 0; }
  .video { position: relative; background: #0B1424; min-width: 0; min-height: 0; display: grid; }
  #call { width: 100%; height: 100%; }
  #call iframe { width: 100%; height: 100%; border: 0; display: block; }
  .prejoin { align-self: center; justify-self: center; width: min(460px, calc(100% - 32px)); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 26px; display: grid; gap: 16px; box-shadow: var(--shadow); margin-block: 24px; }
  .prejoin ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .prejoin li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; color: var(--ink-soft); }
  .prejoin li b { color: var(--accent); }
  .panel { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .panel .tabs { margin: 0; padding-inline: 10px; flex: none; }
  .pane { flex: 1; min-height: 0; overflow: auto; }
  .pane.pad { padding: 18px; display: grid; gap: 16px; align-content: start; }
  #pScore { display: flex; flex-direction: column; }
  #pScore .picker { padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  #scoreFrame { flex: 1; width: 100%; border: 0; min-height: 360px; background: var(--surface-2); }
  .bpm { display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
  .bpm .val { font: 800 3.4rem/1 var(--f-display); letter-spacing: -0.04em; }
  .beats { display: grid; gap: 8px; }
  .beat { height: 14px; border-radius: 999px; background: var(--surface-2); transition: background .06s; }
  .beat.on { background: var(--orange); }
  .beat.on.accent { background: var(--accent); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .stepper { display: flex; gap: 8px; align-items: center; }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font: 700 1.2rem var(--f-display); cursor: pointer; flex: none; }
  .note-big { font: 800 4.2rem/1 var(--f-display); letter-spacing: -0.03em; text-align: center; min-height: 1em; }
  .gauge { position: relative; height: 70px; }
  .gauge .scale { position: absolute; left: 0; right: 0; top: 34px; height: 2px; background: var(--line); }
  .gauge .tick { position: absolute; top: 24px; width: 2px; height: 22px; background: var(--line); transform: translateX(-1px); }
  .gauge .tick.mid { background: var(--good); height: 30px; top: 20px; }
  .gauge .needle { position: absolute; top: 10px; width: 4px; height: 50px; border-radius: 2px; background: var(--ink-soft); transform: translateX(-2px); left: 50%; transition: left .12s ease-out, background .12s; }
  .gauge .needle.good { background: var(--good); }
  .gauge .lbl { position: absolute; top: 52px; font: 500 .7rem var(--f-mono); color: var(--ink-soft); transform: translateX(-50%); }
  .strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .string { text-align: center; padding: 8px 0; border-radius: 10px; border: 1.5px solid var(--line); font: 700 .95rem var(--f-mono); }
  .string.active { border-color: var(--accent); background: var(--accent-soft); }
  .string.good { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  /* Direct (peer-to-peer) video */
  .p2p { position: relative; display: grid; grid-template-rows: 1fr auto; min-height: 0; height: 100%; }
  .vgrid { position: relative; display: grid; gap: 8px; padding: 8px; min-height: 0; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); grid-auto-rows: 1fr; align-content: stretch; }
  .vtile { position: relative; background: #19283F; border-radius: 12px; overflow: hidden; min-height: 160px; display: grid; place-items: center; }
  .vtile video { width: 100%; height: 100%; object-fit: cover; display: block; background: #0B1424; }
  .vtile.self video { transform: scaleX(-1); }
  .vtile.self.screen video { transform: none; object-fit: contain; }
  .vtile:not(.self) video { object-fit: contain; }
  .vtile .vname { position: absolute; left: 10px; bottom: 10px; background: rgba(11,20,36,.72); color: #fff; font: 600 .78rem var(--f-body); padding: 4px 9px; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
  .vtile .vstate { position: absolute; inset: 0; display: grid; place-items: center; color: #C9D6EA; font-size: .9rem; background: rgba(11,20,36,.6); text-align: center; padding: 16px; }
  .vtile .vavatar { position: absolute; width: 72px; height: 72px; border-radius: 50%; background: #0F1F3A; color: #fff; display: grid; place-items: center; font: 700 1.4rem var(--f-display); }
  .vtile .muted-ic { color: #FF8A80; }
  .vtile .tap { position: absolute; inset: auto 10px 48px auto; }
  .vgrid:not(.duo):not(.solo) { align-content: center; grid-auto-rows: auto; }
  .vgrid:not(.duo):not(.solo) .vtile { aspect-ratio: 16 / 9; min-height: 0; }
  .vgrid.duo { grid-template-columns: 1fr; }
  .vgrid.duo .vtile.self { position: absolute; right: 18px; bottom: 18px; width: min(28%, 240px); min-height: 0; aspect-ratio: 4 / 3; z-index: 2; box-shadow: 0 6px 20px rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.25); }
  .vgrid.solo .vtile.self { max-width: 720px; justify-self: center; width: 100%; aspect-ratio: 16 / 10; }
  .waiting { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: rgba(11,20,36,.8); color: #C9D6EA; padding: 8px 14px; border-radius: 999px; font-size: .85rem; z-index: 3; white-space: nowrap; }
  .ctrlbar { display: flex; justify-content: center; gap: 8px; padding: 10px; background: #0F1F3A; flex-wrap: wrap; position: relative; }
  .cb { min-width: 46px; height: 46px; border-radius: 999px; border: 0; background: #243653; color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font: 600 .85rem var(--f-body); }
  .cb[aria-pressed="false"].tog { background: #B3261E; }
  .cb.on { background: #FFB26B; color: #0F1F3A; }
  .cb.leave { background: #B3261E; }
  .cb svg { width: 20px; height: 20px; }
  .devpanel { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 16px; width: min(360px, calc(100% - 24px)); display: grid; gap: 12px; box-shadow: var(--shadow); z-index: 5; }
  @media (max-width: 600px) { .cb .lbl { display: none; } }
  .errbox { align-self: center; justify-self: center; max-width: 460px; margin: 24px 16px; background: var(--surface); color: var(--ink); padding: 22px; border-radius: 16px; display: grid; gap: 12px; }
  @media (max-width: 980px) {
    body { height: auto; }
    .aula { grid-template-columns: 1fr; }
    .video { min-height: 70vh; }
    .panel { border-left: 0; border-top: 1px solid var(--line); min-height: 80vh; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap" style="max-width:none">
    <a class="logo" href="app.html"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V6l10-2v12" stroke="#FFB26B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.6" fill="#FFB26B"/><circle cx="16.5" cy="16" r="2.6" fill="#FFB26B"/></svg></span></a>
    <div style="min-width:0"><b id="lTitle" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">…</b><span class="small muted" id="lWhen"></span></div>
    <div class="right">
      <div class="seg" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div>
      <a class="btn btn-ghost btn-sm" href="app.html" data-i18n="au.back">Volver al panel</a>
    </div>
  </div>
</header>

<main class="aula">
  <section class="video" aria-label="Video">
    <div class="prejoin" id="prejoin">
      <span class="eyebrow" data-i18n="au.tipHead">Antes de empezar</span>
      <ul>
        <li><b><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg></b><span data-i18n="au.tip1"></span></li>
        <li><b>♪</b><span data-i18n="au.tip2"></span></li>
        <li><b>⇄</b><span data-i18n="au.tip3"></span></li>
      </ul>
      <button class="btn btn-orange" id="joinBtn" data-i18n="au.join">Entrar a la videollamada</button>
      <span class="err" id="joinErr" hidden></span>
    </div>
    <div id="call" hidden></div>
    <div class="p2p" id="p2p" hidden>
      <div class="vgrid solo" id="vgrid"><div class="waiting" id="waiting" data-i18n="au.waiting">Esperando a que entren los demás…</div></div>
      <div class="ctrlbar">
        <button class="cb tog" id="cMic" aria-pressed="true" title="Micrófono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="cb tog" id="cCam" aria-pressed="true" title="Cámara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg></button>
        <button class="cb" id="cScreen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="lbl" data-i18n="au.screen">Compartir pantalla</span></button>
        <button class="cb" id="cVoice" aria-pressed="false"><span class="lbl" data-i18n="au.voice">Modo voz</span></button>
        <button class="cb" id="cDev" aria-label="Dispositivos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
        <button class="cb leave" id="cLeave"><span class="lbl" data-i18n="au.leave">Salir</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 17l5-5-5-5M21 12H9M12 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/></svg></button>
        <div class="devpanel" id="devPanel" hidden>
          <div class="field"><label for="selMic" data-i18n="au.micSel">Micrófono</label><select id="selMic"></select></div>
          <div class="field"><label for="selCam" data-i18n="au.camSel">Cámara</label><select id="selCam"></select></div>
          <p class="small muted" data-i18n="au.voiceHint"></p>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" data-pane="pScore" aria-selected="true" data-i18n="au.tabScore">Partitura</button>
      <button role="tab" data-pane="pMetro" aria-selected="false" data-i18n="au.tabMetro">Metrónomo</button>
      <button role="tab" data-pane="pTuner" aria-selected="false" data-i18n="au.tabTuner">Afinador</button>
    </div>

    <div class="pane" id="pScore">
      <div class="picker" id="picker" hidden>
        <div class="field" style="flex:1"><select id="scoreSel" aria-label="score"></select></div>
      </div>
      <iframe id="scoreFrame" title="Partitura" allow="clipboard-write"></iframe>
    </div>

    <div class="pane pad" id="pMetro" hidden>
      <div class="section-title"><span class="eyebrow" data-i18n="au.tabMetro">Metrónomo</span><span class="mono" id="tempoName" style="color:var(--accent);font-style:italic">Andante</span></div>
      <div class="bpm"><span class="val" id="bpmVal">80</span><span class="mono muted">♩ = BPM</span></div>
      <div class="beats" id="beats"></div>
      <input type="range" id="bpm" min="30" max="240" value="80" aria-label="BPM">
      <div class="stepper">
        <button class="round" id="bpmDown" aria-label="-1">−</button>
        <button class="btn btn-block" id="metroToggle" data-i18n="metro.start">Iniciar</button>
        <button class="round" id="bpmUp" aria-label="+1">+</button>
      </div>
      <div class="field"><label for="beatsSel" data-i18n="au.beats">Tiempos por compás</label>
        <select id="beatsSel"><option>2</option><option>3</option><option selected>4</option><option>6</option></select></div>
      <label class="check" id="shareWrap" hidden><input type="checkbox" id="shareMetro" checked> <span data-i18n="au.share">Compartir con la clase</span></label>
      <div class="pill" id="sharedPill" hidden style="justify-self:start"></div>
      <label class="check"><input type="checkbox" id="muteMetro"> <span data-i18n="au.localMute">Silenciar en mi dispositivo</span></label>
    </div>

    <div class="pane pad" id="pTuner" hidden>
      <div class="seg" role="group" style="justify-self:start">
        <button type="button" data-tmode="guitar" aria-pressed="true" data-i18n="au.guitar">Guitarra</button>
        <button type="button" data-tmode="chromatic" aria-pressed="false" data-i18n="au.chromatic">Cromático</button>
      </div>
      <div class="note-big" id="tNote">—</div>
      <div class="gauge" aria-hidden="true">
        <div class="scale"></div>
        <div class="tick" style="left:0%"></div><div class="tick" style="left:25%"></div><div class="tick mid" style="left:50%"></div><div class="tick" style="left:75%"></div><div class="tick" style="left:100%"></div>
        <span class="lbl" style="left:0%">−50</span><span class="lbl" style="left:50%">0</span><span class="lbl" style="left:100%">+50</span>
        <div class="needle" id="needle"></div>
      </div>
      <div style="text-align:center" class="mono" id="tInfo" aria-live="polite">&nbsp;</div>
      <div class="strings" id="strings"></div>
      <button class="btn" id="tunerBtn" data-i18n="au.tunerStart">Activar afinador</button>
      <p class="small muted" data-i18n="au.tunerHint">Toca una cuerda o una nota y mantenla.</p>
    </div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js?v=9"></script>
<script src="common.js?v=9"></script>
<script>
(function () {
  const K = window.Compas;
  const { sb, t, esc, instName, fmtLongDateTime, toast, fail, initials, C } = K;
  const $ = (id) => document.getElementById(id);
  const lessonId = new URLSearchParams(location.search).get("lesson");
  let me = null, lesson = null, isTeacher = false, code = "", callFrame = null, aulaCh = null;

  K.applyStatic();
  K.bindLang(() => { renderHeader(); renderStrings(); updateMetroUi(); });

  /* ---------- Tabs ---------- */
  document.querySelectorAll("[data-pane]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("[data-pane]").forEach((x) => { x.setAttribute("aria-selected", String(x === b)); $(x.dataset.pane).hidden = x !== b; });
  }));

  /* ---------- Boot ---------- */
  async function boot() {
    const { data } = await sb.auth.getSession();
    if (!data.session) return location.replace("entrar.html?next=" + encodeURIComponent("aula.html" + location.search));
    if (!lessonId) return showError(t("au.err.noLesson"));
    const uid = data.session.user.id;
    me = (await sb.from("profiles").select("*").eq("id", uid).maybeSingle()).data;
    const res = await sb.from("lessons").select("*").eq("id", lessonId).maybeSingle();
    lesson = res.data;
    if (!me || !lesson) return showError(t("au.err.no_access"));
    isTeacher = lesson.teacher_id === me.id || me.role === "admin";
    code = "L" + lesson.id.replace(/-/g, "").slice(0, 7).toUpperCase();
    renderHeader();
    setupScore();
    setupMetroChannel();
  }
  function renderHeader() {
    if (!lesson) return;
    $("lTitle").textContent = lesson.title || instName(lesson.instrument);
    $("lWhen").textContent = fmtLongDateTime(lesson.starts_at) + " · " + lesson.duration_min + " min";
  }
  function showError(msg) {
    $("prejoin").hidden = true; $("call").hidden = true;
    const box = document.createElement("div"); box.className = "errbox";
    box.innerHTML = `<p>${esc(msg)}</p><a class="btn btn-ghost btn-sm" href="app.html" style="justify-self:start">${esc(t("au.back"))}</a>`;
    document.querySelector(".video").append(box);
  }

  /* ---------- Video (Daily Prebuilt, music audio mode) ---------- */
  async function readFnError(error) {
    const ctx = error && error.context;
    if (ctx && typeof ctx.status === "number") {
      let body = {};
      try { body = await ctx.clone().json(); } catch (e) { try { body = { message: await ctx.text() }; } catch (e2) {} }
      return { status: ctx.status, ...body };
    }
    return { status: 0, error: "fetch", message: (error && error.message) || "" };
  }
  const loadScript = (src) => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
  $("joinBtn").addEventListener("click", () => ((C.videoMode || "p2p") === "daily" ? joinDaily() : joinP2P()));
  async function joinDaily() {
    const btn = $("joinBtn"); btn.disabled = true; btn.textContent = t("au.joining"); $("joinErr").hidden = true;
    try {
      if (!window.Daily) await loadScript("https://cdn.jsdelivr.net/npm/@daily-co/daily-js@0.92.2/dist/daily.js");
      const { data, error } = await sb.functions.invoke("daily-room", { body: { lesson_id: lessonId } });
      if (error) {
        const body = await readFnError(error);
        const key = "au.err." + (body.error || "server");
        const known = body.error && t(key) !== key;
        let msg = known ? t(key) : t("au.err.server");
        if (!known) {
          const detail = body.detail ? (body.detail.info || body.detail.error || JSON.stringify(body.detail)) : (body.message || body.msg || "");
          msg += ` [${body.status || "?"} ${body.error || ""}${detail ? ": " + String(detail).slice(0, 160) : ""}]`;
        }
        console.error("daily-room error", body);
        if (body.opens_at) msg = msg.replace("{t}", new Date(body.opens_at).toLocaleTimeString(K.loc(), { hour: "numeric", minute: "2-digit" }));
        throw new Error(msg);
      }
      $("prejoin").hidden = true; $("call").hidden = false;
      callFrame = Daily.createFrame($("call"), {
        showLeaveButton: true, showFullscreenButton: true, lang: K.lang,
        iframeStyle: { width: "100%", height: "100%", border: "0" },
        dailyConfig: { micAudioMode: "music" },   // 256 kbps stereo, no voice filters
        theme: { colors: { accent: "#1F5FD1", accentText: "#FFFFFF", background: "#0F1F3A", backgroundAccent: "#19283F",
          baseText: "#EAF1FB", border: "#243653", mainAreaBg: "#0B1424", mainAreaBgAccent: "#19283F", mainAreaText: "#FFFFFF", supportiveText: "#9FB2CC" } },
      });
      callFrame.on("left-meeting", () => { callFrame.destroy(); callFrame = null; $("call").hidden = true; $("prejoin").hidden = false; btn.disabled = false; btn.textContent = t("au.join"); });
      callFrame.on("error", (e) => fail(new Error(e && e.errorMsg)));
      await callFrame.join({ url: data.url, token: data.token, userName: me.full_name || "" });
    } catch (e) {
      $("joinErr").textContent = e.message || t("au.err.server"); $("joinErr").hidden = false;
      btn.disabled = false; btn.textContent = t("au.join");
      $("prejoin").hidden = false; $("call").hidden = true;
    }
  }

  /* ---------- Direct video (WebRTC peer-to-peer, Supabase Realtime only for the handshake) ---------- */
  const ICE = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }, ...(C.turnServers || [])];
  const RTC = { local: null, peers: new Map(), ch: null, myId: null, voice: false, screen: null, micId: "", camId: "", early: {} };
  const ICON = {
    micOff: '<svg class="muted-ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 3l18 18M9 9v2a3 3 0 0 0 5 2.2M15 10V6a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 11.5 5.4M19 11a7 7 0 0 1-.6 2.8M12 18v3"/></svg>',
  };
  const audioC = (voice, id) => Object.assign({ echoCancellation: voice, noiseSuppression: voice, autoGainControl: voice, channelCount: { ideal: 2 }, sampleRate: { ideal: 48000 } }, id ? { deviceId: { exact: id } } : {});
  const videoC = (id) => Object.assign({ width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, id ? { deviceId: { exact: id } } : {});

  // Opus for music: stereo, 256 kbps, no silence-skipping, error correction on
  function tuneOpus(sdp) {
    const m = sdp.match(/a=rtpmap:(\d+) opus\/48000/i); if (!m) return sdp;
    const pt = m[1];
    return sdp.replace(new RegExp(`a=fmtp:${pt} ([^\r\n]*)`), (line, params) => {
      const kv = {}; params.split(";").forEach((s) => { const [k, v] = s.trim().split("="); if (k) kv[k] = v; });
      Object.assign(kv, { stereo: "1", "sprop-stereo": "1", maxaveragebitrate: "256000", useinbandfec: "1", usedtx: "0", maxplaybackrate: "48000" });
      return `a=fmtp:${pt} ` + Object.entries(kv).map(([k, v]) => `${k}=${v}`).join(";");
    });
  }

  /* ---------- Tuner (runs only on this device) ---------- */

  }

  function autoCorrelate(buf, sr) {

    const freq = history.slice().sort((a, b) => a - b)[Math.floor(history.length / 2)];
    const m = midiOf(freq);
    let target = Math.round(m);
    if (tMode === "guitar") target = GUITAR.reduce((best, s) => (Math.abs(s - m) < Math.abs(best - m) ? s : best), GUITAR[0]);
    const cents = Math.max(-50, Math.min(50, Math.round(1200 * Math.log2(freq / freqOf(target)))));
    const good = Math.abs(cents) <= 5;
    $("tNote").textContent = noteName(target);

    $("needle").classList.toggle("good", good);
    $("tInfo").textContent = `${freq.toFixed(1)} Hz · ${cents > 0 ? "+" : ""}${cents}¢ · ${good ? t("au.inTune") : cents < 0 ? t("au.low") : t("au.high")}`;
    if (tMode === "guitar") renderStrings(target, good);
  }
  async function tunerStart() {
    tStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    tCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = tCtx.createMediaStreamSource(tStream);
    tAnalyser = tCtx.createAnalyser(); tAnalyser.fftSize = 2048; src.connect(tAnalyser);
    tBuf = new Float32Array(tAnalyser.fftSize);
    tTimer = setInterval(tick, 90);
    $("tunerBtn").textContent = t("au.tunerStop");
  }
  function tunerStop() {
    clearInterval(tTimer); tTimer = null;
    if (tStream) tStream.getTracks().forEach((tr) => tr.stop());
    if (tCtx) tCtx.close(); tStream = tCtx = null; history = [];
    $("tunerBtn").textContent = t("au.tunerStart"); $("tInfo").innerHTML = "&nbsp;"; $("tNote").textContent = "—";
    $("needle").style.left = "50%"; renderStrings();
  }
  $("tunerBtn").addEventListener("click", () => (tTimer ? tunerStop() : tunerStart().catch(fail)));

  boot().catch(fail);
})();
</script>
</body>
</html>
